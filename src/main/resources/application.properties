spring.application.name=estoque
# URL de Conexao: ajuste a porta (3306) e o nome do banco (meu_banco)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?${DB_PARAMS}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuraçoes do JPA / Hibernate
# "update": Cria as tabelas e altera colunas automaticamente sem apagar dados
spring.jpa.hibernate.ddl-auto=update

# Mostra as instruções SQL executadas no console (útil para testes)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=uma-chave-secreta-muito-grande-e-segura
jwt.expiration=86400000